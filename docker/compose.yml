# ═══════════════════════════════════════════════════════════════════════════════
# NovaCal — Docker Compose (Production)
# Target: Dokploy / Self-Hosted VPS
# Orchestrates 4 containers: web, realtime, postgres, redis
#
# 📋 DOKPLOY DEPLOYMENT GUIDE:
#   ├── Navigate to Dokploy Dashboard → Services → New Service
#   ├── Repository: https://github.com/user-ahsan/NovaCal
#   ├── Branch: main
#   ├── Build Method: Docker Compose
#   ├── Compose File: docker/compose.yml
#   └── Deploy!
#
# 🔗 INGRESS MAPPING:
#   calendar.yourdomain.com  →  novacal-web:3000       (HTTPS - REST + pages)
#   ws.yourdomain.com        →  novacal-realtime:3001   (WSS - WebSocket + SSE)
#
# ☁️ CLOUDFLARE TUNNEL:
#   Set TRUST_PROXY=true in .env for correct IP detection behind CF tunnel.
#   Both web and realtime services support X-Forwarded-For / X-Forwarded-Proto.
#
# 🚀 QUICK START:
#   cp .env.example .env          # Edit with your settings
#   docker compose -f docker/compose.yml up -d --build
#   curl http://localhost:3000/api/health
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ── 1. Web App (Next.js 15 + REST API) ────────────────────────────────────
  novacal-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        - BUN_VERSION=1.3.13
    image: novacal-web:latest
    container_name: novacal-web
    ports:
      - "3000:3000"
    env_file: ../.env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      novacal-db:
        condition: service_healthy
      novacal-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "run", "-e", "const h=require('http');h.get('http://localhost:3000/api/health',r=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>process.exit(JSON.parse(d).status==='healthy'?0:1))}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - novacal-net

  # ── 2. Real-time Server (WebSocket UI + SSE MCP) ──────────────────────────
  novacal-realtime:
    build:
      context: ..
      dockerfile: docker/realtime.Dockerfile
      args:
        - BUN_VERSION=1.3.13
    image: novacal-realtime:latest
    container_name: novacal-realtime
    ports:
      - "3001:3001"
    env_file: ../.env
    environment:
      - NODE_ENV=production
      - WS_PORT=3001
      - WS_URL=wss://ws.yourdomain.com
    depends_on:
      novacal-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "run", "-e", "const h=require('http');h.get('http://localhost:3001/health',r=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>process.exit(JSON.parse(d).status==='healthy'?0:1))}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - novacal-net

  # ── 3. PostgreSQL 16 ──────────────────────────────────────────────────────
  # Internal only. No external port exposure.
  novacal-db:
    image: postgres:16-alpine
    container_name: novacal-db
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=novacal
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-password}
      - POSTGRES_DB=novacal
      - PGDATA=/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novacal"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - novacal-net

  # ── 4. Redis 7 ────────────────────────────────────────────────────────────
  # Internal only. No external port exposure.
  # Session storage | WebSocket Pub/Sub | Rate limiting | QR challenge TTL
  novacal-redis:
    image: redis:7-alpine
    container_name: novacal-redis
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - novacal-net

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  novacal-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
